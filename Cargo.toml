[workspace]
resolver = "2"
members = ["crates/engine", "crates/engine-wasm", "crates/rooms", "crates/bridge", "crates/relay"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

[profile.release.package.designotron-engine-wasm]
opt-level = "s"
