<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:#F8FAFC;padding:32px}
form{width:400px;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
label{font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px}
.input{height:40px;border:1px solid #CBD5E1;border-radius:8px;padding:0 12px;display:flex;align-items:center;font-size:14px;color:#0F172A}
.textarea{height:88px;border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;color:#94A3B8}
.row{display:flex;gap:12px}
.row > div{flex:1}
.submit{height:44px;border-radius:8px;background:#4F46E5;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;color:#64748B;margin-top:-8px}
</style></head><body>
<form>
<div><label>Project name</label><div class="input">Spring campaign</div></div>
<div class="row"><div><label>Start</label><div class="input">01/03/2026</div></div><div><label>End</label><div class="input">30/04/2026</div></div></div>
<div><label>Description</label><div class="textarea">Landing pages and emails for the spring launch.</div><div class="hint">Max 280 characters</div></div>
<div class="submit">Create project</div>
</form></body></html>
