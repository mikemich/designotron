<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:#fff;padding:24px;display:flex;gap:20px}
.card{width:300px;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px rgba(15,23,42,0.12);background:#fff}
.img{height:160px;background:linear-gradient(135deg,#F472B6,#7C3AED)}
.content{padding:18px 20px 20px}
.tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7C3AED}
.title{font-size:20px;font-weight:700;margin:6px 0 8px;color:#111827}
.text{font-size:14px;line-height:1.5;color:#4B5563;margin:0 0 16px}
.cta{display:inline-block;padding:10px 16px;border-radius:8px;background:#111827;color:#fff;font-weight:600;font-size:14px}
.outline{border:2px solid #7C3AED}
</style></head><body>
<div class="card"><div class="img"></div><div class="content"><div class="tag">New</div><div class="title">Team workspace</div><p class="text">Collaborate with your team in real time, with shared libraries and comments.</p><span class="cta">Open workspace</span></div></div>
<div class="card outline"><div class="img" style="background:#0EA5E9"></div><div class="content"><div class="tag" style="color:#0EA5E9">Beta</div><div class="title">Prototypes</div><p class="text">Link screens together and test flows on a phone.</p><span class="cta" style="background:#0EA5E9">Try it</span></div></div>
</body></html>
