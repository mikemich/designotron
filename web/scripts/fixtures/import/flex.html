<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:#F8FAFC}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid #E2E8F0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#0F172A}
.dot{width:24px;height:24px;border-radius:6px;background:#4F46E5}
.links{display:flex;gap:24px;font-size:14px;color:#475569}
.btn{padding:8px 16px;background:#111827;color:#fff;border-radius:999px;font-size:14px}
.body{display:flex;gap:24px;padding:24px 32px}
.side{width:200px;display:flex;flex-direction:column;gap:8px}
.side div{padding:10px 12px;border-radius:8px;font-size:14px;color:#334155}
.side .on{background:#E0E7FF;color:#3730A3;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;gap:16px}
.panel{background:#fff;padding:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:0;font-size:16px}
.panel span{color:#64748B;font-size:13px}
</style></head><body>
<div class="nav"><div class="brand"><div class="dot"></div>Acme</div>
<div class="links"><span>Products</span><span>Pricing</span><span>Docs</span></div>
<div class="btn">Sign in</div></div>
<div class="body"><div class="side"><div class="on">Overview</div><div>Projects</div><div>Team</div><div>Settings</div></div>
<div class="main"><div class="panel"><div><h3>Revenue</h3><span>Last 30 days</span></div><span>$12,480</span></div>
<div class="panel"><div><h3>Active users</h3><span>Today</span></div><span>1,204</span></div></div></div>
</body></html>
