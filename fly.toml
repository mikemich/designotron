# Fly.io deployment of the Designotron relay (online multiplayer + the editor).
#   fly launch --copy-config --no-deploy   # pick a unique app name when asked
#   fly volumes create designotron_rooms --size 1
#   fly deploy
app = "designotron-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms are live WebSocket sessions; keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "designotron_rooms"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
