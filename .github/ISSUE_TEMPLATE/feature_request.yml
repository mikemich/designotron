name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job or workflow, not the solution. "I want to hand off specs to developers without…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: figma
    attributes:
      label: How do you do this today?
      description: In Figma or another tool, if relevant.
