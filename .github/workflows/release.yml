name: Release

# Builds binaries for every platform and publishes a GitHub release. Either push a tag
# like v0.2.0, or run it from the Actions tab with a version (it creates the tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-14, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build editor
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build bridge with the editor embedded, and the relay
        run: cargo build --release -p designotron-bridge --features embed-web -p designotron-relay --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../designotron-${{ matrix.target }}.tar.gz designotron
          tar czf ../../../designotron-relay-${{ matrix.target }}.tar.gz designotron-relay
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/designotron.exe -DestinationPath designotron-${{ matrix.target }}.zip
          Compress-Archive -Path target/${{ matrix.target }}/release/designotron-relay.exe -DestinationPath designotron-relay-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: designotron-${{ matrix.target }}
          path: designotron-*${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
