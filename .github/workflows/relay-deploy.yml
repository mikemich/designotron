name: Deploy relay

# Deploys the relay (online multiplayer) to Fly.io on every push to main, then rebuilds the
# hosted editor so "Share online" uses it. Inactive until you add, in Settings → Secrets and
# variables → Actions:
#   secret   FLY_API_TOKEN  (fly tokens create org, or fly.io → Tokens)
#   variable FLY_APP        (a unique app name, e.g. designotron-relay-yourname)
# The first run creates the app and its volume. The relay is at https://<FLY_APP>.fly.dev.
on:
  push:
    branches: [main]
    paths: ["crates/**", "web/**", "Cargo.*", "Dockerfile", "fly.toml", ".github/workflows/relay-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$FLY_API_TOKEN" ] && [ -n "$APP" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Relay deploy skipped: set the FLY_API_TOKEN secret and FLY_APP variable to enable it."; fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.setup.outputs.ready
      - name: Create the app and volume (first run only)
        if: steps.setup.outputs.ready
        run: |
          flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP"
          flyctl volumes list --app "$APP" | grep -q designotron_rooms \
            || flyctl volumes create designotron_rooms --app "$APP" --region iad --size 1 --yes
      - name: Deploy
        if: steps.setup.outputs.ready
        run: flyctl deploy --remote-only --app "$APP" --ha=false
      - name: Check health
        if: steps.setup.outputs.ready
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://$APP.fly.dev/health"
      - name: Rebuild the hosted editor with this relay
        if: steps.setup.outputs.ready && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
