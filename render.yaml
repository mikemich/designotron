# Render blueprint for the Designotron relay (online multiplayer + the editor), on the free
# plan. Deploy: the "Deploy to Render" button in docs/relay.md, or Dashboard → New →
# Blueprint → this repository.
#
# It runs the public image that relay-image.yml publishes on every push to main. Free
# services sleep after about 15 idle minutes and lose their rooms when they do; editors
# that reconnect put the file back. For rooms that survive restarts, use plan: starter
# and add a disk mounted at /data.
services:
  - type: web
    name: designotron-relay
    runtime: image
    image:
      url: ghcr.io/mikemich/designotron-relay:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      # Render's proxy appends the client's address to X-Forwarded-For; per-address limits
      # use it (otherwise every client looks like the proxy).
      - key: DESIGNOTRON_TRUST_PROXY
        value: "1"
      # The free plan has 512 MB of RAM; see docs/relay.md for what this budget counts.
      - key: DESIGNOTRON_MAX_TOTAL_BYTES
        value: 192MB
      # One big file with several people can fill a small budget on its own (each editor's
      # WebSocket buffers keep a file-sized copy), so the free relay takes files up to 20 MB.
      - key: DESIGNOTRON_MAX_ROOM_BYTES
        value: 20MB
