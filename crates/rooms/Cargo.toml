[package]
name = "designotron-rooms"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multiplayer rooms: merges collaborators' document deltas and relays presence over WebSocket"

[dependencies]
designotron-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.41", features = ["sync", "time", "fs", "macros", "rt"] }
futures-util = "0.3"
log = "0.4"
