[package]
name = "designotron-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local bridge: serves the editor, exposes MCP for Claude Code and runs Claude Code chat"

[[bin]]
name = "designotron"
path = "src/main.rs"

[dependencies]
designotron-engine = { path = "../engine" }
designotron-rooms = { path = "../rooms" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net", "signal"] }
tower-http = { version = "0.6.2", features = ["fs"] }
futures-util = "0.3"
log = "0.4"
ureq = { version = "2.12", features = ["native-certs"] }
url = "2"
base64 = "0.22"
rust-embed = { version = "8.5", features = ["mime-guess"], optional = true }
env_logger = "0.11"

[features]
# Bundle web/dist into the binary (release builds). Requires `npm run build` in web/ first.
embed-web = ["dep:rust-embed"]
